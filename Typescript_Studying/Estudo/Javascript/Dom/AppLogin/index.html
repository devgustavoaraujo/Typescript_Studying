<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <section id="formssection">
      <form id="forms" method="post">
        <h1 id="topText">FAÇA SEU REGISTRO</h1>
        <div id="resultcss">
          <div id="result"></div>
        </div>
        <div>
          <label id="labelname" for="text">Digite seu Nome: </label>
          <input type="text" id="name" placeholder="Digite seu Nome" />
        </div>
        <div>
          <label for="email">Digite seu Email: </label>
          <input type="email" id="email" placeholder="Digite seu Email" />
        </div>
        <div>
          <label for="email">Digite sua Senha: </label>
          <input type="password" id="senha" placeholder="Digite sua Senha" />
        </div>

        <div id="buttonDiv">
          <button type="submit" id="button"><span id="buttonText">Registrar Agora</span></button>
          <button type="submit" id="buttonLogin"><span id="buttonText">Entrar Agora</span></button>
        </div>
      </form>
      <div id="menu"></div>
    </section>
  </body>
  <script src="main.js"></script>
</html>
